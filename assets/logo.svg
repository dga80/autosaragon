<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none">
  <defs>
    <linearGradient id="aragonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="silverChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Emblem: Stylized Double 'A' Chassis Crest -->
  <g transform="translate(6, 6)">
    <!-- Outer geometric shield -->
    <path d="M26 2 L48 48 L4 48 Z" fill="none" stroke="url(#silverChrome)" stroke-width="2.5" stroke-linejoin="round" opacity="0.4"/>
    <!-- Dynamic aerodynamic A -->
    <path d="M26 6 L44 46 L33 46 L26 28 L19 46 L8 46 Z" fill="url(#aragonRed)" filter="url(#glow)"/>
    <!-- Velocity inner cut -->
    <polygon points="26,16 31,34 21,34" fill="#0b0f17"/>
    <!-- Speed accent wing -->
    <path d="M12 40 L40 40 L38 44 L14 44 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Typography -->
  <!-- Main Brand Title -->
  <text x="64" y="32" font-family="'Sora', sans-serif" font-size="22" font-weight="800" letter-spacing="1.5" fill="#f8fafc">AUTOS</text>
  <text x="146" y="32" font-family="'Sora', sans-serif" font-size="22" font-weight="800" letter-spacing="1.5" fill="url(#aragonRed)">ARAGÓN</text>

  <!-- Subtitle Tagline -->
  <text x="65" y="47" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="2.5" fill="#94a3b8">BARCELONA • DESDE 1994</text>
  <circle cx="218" cy="44" r="2.5" fill="#10b981"/>
</svg>
